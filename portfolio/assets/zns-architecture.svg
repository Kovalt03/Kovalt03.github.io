<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <title>dm-zns-base 구조: ext4의 임의 쓰기를 LSM-Tree 매핑으로 ZNS SSD 순차 쓰기로 변환</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5F6763"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#F3F5F3"/>

  <!-- 파일시스템 -->
  <rect x="190" y="26" width="420" height="54" rx="8" fill="#FFFFFF" stroke="#D2D6D2"/>
  <text x="400" y="60" text-anchor="middle" font-size="22" font-weight="600" fill="#171A18">ext4 · 임의 위치 읽기/쓰기</text>

  <line x1="400" y1="82" x2="400" y2="120" stroke="#5F6763" stroke-width="2" marker-end="url(#arr)"/>
  <text x="414" y="107" font-size="15" fill="#5F6763">random write</text>

  <!-- Device Mapper 타깃 -->
  <rect x="60" y="126" width="680" height="220" rx="10" fill="#DDE5E1"/>
  <text x="84" y="160" font-size="20" font-weight="700" fill="#2F5D50">dm-zns-base · Device Mapper 타깃</text>
  <text x="716" y="160" text-anchor="end" font-size="15" fill="#2F5D50">LBA → 물리 위치 매핑</text>

  <g font-size="19" font-weight="600" fill="#171A18" text-anchor="middle">
    <rect x="84" y="178" width="190" height="72" rx="8" fill="#FFFFFF"/>
    <text x="179" y="210">memtable</text>
    <text x="179" y="235" font-size="14" font-weight="400" fill="#5F6763">RAM · skip list</text>

    <rect x="305" y="178" width="190" height="72" rx="8" fill="#FFFFFF"/>
    <text x="400" y="210">SSTable</text>
    <text x="400" y="235" font-size="14" font-weight="400" fill="#5F6763">정렬된 매핑 · 불변</text>

    <rect x="526" y="178" width="190" height="72" rx="8" fill="#FFFFFF"/>
    <text x="621" y="210">WAL</text>
    <text x="621" y="235" font-size="14" font-weight="400" fill="#5F6763">크래시 복구</text>

    <rect x="84" y="264" width="300" height="60" rx="8" fill="#2F5D50"/>
    <text x="234" y="300" fill="#FFFFFF">zone pool · dispatch gate</text>

    <rect x="416" y="264" width="300" height="60" rx="8" fill="#FFFFFF" stroke="#2F5D50" stroke-dasharray="5 4"/>
    <text x="566" y="300" fill="#2F5D50">compaction · GC</text>
  </g>
  <line x1="274" y1="214" x2="300" y2="214" stroke="#5F6763" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="400" y1="348" x2="400" y2="386" stroke="#5F6763" stroke-width="2" marker-end="url(#arr)"/>
  <text x="414" y="373" font-size="15" fill="#5F6763">sequential write</text>

  <!-- ZNS SSD: zone마다 write pointer까지만 차 있음 -->
  <rect x="60" y="392" width="680" height="84" rx="10" fill="#FFFFFF" stroke="#D2D6D2"/>
  <text x="84" y="440" font-size="20" font-weight="700" fill="#171A18">ZNS SSD</text>
  <g>
    <rect x="200" y="408" width="84" height="52" rx="4" fill="#E8EAE7"/>
    <rect x="200" y="408" width="84" height="52" rx="4" fill="#2F5D50"/>
    <rect x="292" y="408" width="84" height="52" rx="4" fill="#E8EAE7"/>
    <rect x="292" y="408" width="84" height="52" rx="4" fill="#2F5D50" opacity=".85"/>
    <rect x="384" y="408" width="84" height="52" rx="4" fill="#E8EAE7"/>
    <rect x="384" y="408" width="58" height="52" rx="4" fill="#2F5D50" opacity=".7"/>
    <rect x="476" y="408" width="84" height="52" rx="4" fill="#E8EAE7"/>
    <rect x="476" y="408" width="30" height="52" rx="4" fill="#2F5D50" opacity=".55"/>
    <rect x="568" y="408" width="84" height="52" rx="4" fill="#E8EAE7"/>
    <rect x="660" y="408" width="64" height="52" rx="4" fill="#E8EAE7"/>
  </g>
  <g stroke="#171A18" stroke-width="2">
    <line x1="442" y1="402" x2="442" y2="466"/>
    <line x1="506" y1="402" x2="506" y2="466"/>
  </g>
  <text x="442" y="489" text-anchor="middle" font-size="13" fill="#5F6763">wp</text>
  <text x="506" y="489" text-anchor="middle" font-size="13" fill="#5F6763">wp</text>
  <text x="84" y="462" font-size="13" fill="#5F6763">zone마다 순차 쓰기</text>
</svg>
