<style>
:root{
  --paper:#E8EAE7;
  --card:#FFFFFF;
  --ink:#171A18;
  --muted:#5F6763;
  --rule:#D2D6D2;
  --accent:#2F5D50;
  --accent-soft:#DDE5E1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:16px;line-height:1.7;letter-spacing:-0.01em;
  word-break:keep-all;overflow-wrap:anywhere;
  padding:0 1.5rem 4rem;
  min-height:100vh;
}
.wrap{max-width:30rem;margin:0 auto}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* 헤더 */
header{text-align:center;padding:4rem 0 2.5rem}
.avatar{
  width:5.5rem;height:5.5rem;margin:0 auto 1.25rem;border-radius:50%;
  background:var(--accent);color:#fff;
  display:grid;place-items:center;
  font-size:1.75rem;font-weight:600;letter-spacing:-0.02em;
}
header h1{font-size:1.625rem;font-weight:600;letter-spacing:-0.035em;line-height:1.3}
header .handle{
  display:inline-block;margin-top:.375rem;
  font-size:.875rem;color:var(--accent);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;
}
header p.bio{margin-top:.875rem;font-size:.9375rem;color:var(--muted);text-wrap:balance}

/* 링크 목록 */
.links{display:grid;gap:.75rem}
.links a.item{
  display:flex;align-items:center;gap:.875rem;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  padding:.9375rem 1.125rem;
  transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease;
}
.links a.item:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(23,26,24,.07);
}
.links .ico{flex:none;width:1.375rem;height:1.375rem;color:var(--accent)}
.links .ico svg{width:100%;height:100%;display:block}
.links .txt{flex:1;min-width:0}
.links .label{font-size:.9375rem;font-weight:500;letter-spacing:-0.015em}
.links .desc{display:block;font-size:.8125rem;color:var(--muted);line-height:1.5}
.links .arrow{flex:none;color:var(--rule);font-size:1rem;transition:color .15s ease}
.links a.item:hover .arrow{color:var(--accent)}

/* 섹션 제목 */
h2.sec{
  font-size:.75rem;font-weight:500;color:var(--muted);
  letter-spacing:.04em;text-transform:uppercase;
  margin:2.25rem 0 .75rem;
}
h2.sec:first-of-type{margin-top:0}

footer{
  margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--rule);
  text-align:center;font-size:.8125rem;color:var(--muted);
}

@media (prefers-color-scheme:dark){
  :root{
    --paper:#151816;
    --card:#1E221F;
    --ink:#E9ECE9;
    --muted:#9AA39E;
    --rule:#2E342F;
    --accent:#7FB8A4;
    --accent-soft:#243029;
  }
  .avatar{color:#151816}
  .links a.item:hover{box-shadow:0 4px 14px rgba(0,0,0,.3)}
}
</style>
</head>
